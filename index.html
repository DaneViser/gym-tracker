<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Phone-friendly weekly gym tracker. Build your own workouts, log sets, see your progress.">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --surface-2: #f0ede7;
    --text: #1b1c1f;
    --muted: #6b6a66;
    --line: #e2ded6;
    --accent: #e8590c;
    --accent-soft: #fdeadf;
    --ok: #2f9e44;
    --ok-soft: #e3f4e6;
    --danger: #d6336c;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121316; --surface: #1b1d21; --surface-2: #24272c; --text: #ecebe8; --muted: #9a9894; --line: #2e3137;
      --accent: #ff7a2f; --accent-soft: #3a2416; --ok: #51cf66; --ok-soft: #1b3322; --danger: #f06595; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121316; --surface: #1b1d21; --surface-2: #24272c; --text: #ecebe8; --muted: #9a9894; --line: #2e3137;
    --accent: #ff7a2f; --accent-soft: #3a2416; --ok: #51cf66; --ok-soft: #1b3322; --danger: #f06595; --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  button, input, select, label, .s-head { touch-action: manipulation; }
  body {
    margin: 0; overscroll-behavior-y: none; background: var(--bg); color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.45;
  }
  body.modal-open { overflow: hidden; }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  header.top .hello { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 1px; min-height: 19px; }
  header.top h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0; white-space: nowrap; }
  header.top h1 span { color: var(--accent); }
  header.top .btns { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; height: 44px; min-width: 44px; font-size: 18px; padding: 0 10px; cursor: pointer;
    font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .icon-btn:hover { border-color: var(--muted); }
  .icon-btn.lang { font-size: 13px; font-weight: 800; letter-spacing: .03em; }

  .weekbar { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 14px 16px; margin-bottom: 18px; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .weeknav .label { text-align: center; }
  .weeknav .label b { display: block; font-size: 16px; }
  .weeknav .label small { color: var(--muted); font-size: 13px; }
  .progress { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .bar.full > i { background: var(--ok); }
  .progress .count { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .history { margin-top: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .history .hlabel { font-size: 12px; color: var(--muted); flex-basis: 100%; }
  .history .wk { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 10px; font-weight: 700; display: grid; place-items: center; color: var(--muted); cursor: pointer; padding: 0; }
  .history .wk.l1 { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); color: var(--text); }
  .history .wk.l2 { background: color-mix(in srgb, var(--accent) 50%, var(--surface)); color: var(--text); }
  .history .wk.l3 { background: color-mix(in srgb, var(--accent) 75%, var(--surface)); color: #fff; }
  .history .wk.l4 { background: var(--ok); color: #fff; border-color: var(--ok); }
  .history .wk.cur { outline: 2px solid var(--text); outline-offset: 1px; }

  .session { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .session.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .session.done { border-color: var(--ok); }
  .s-head { display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer; user-select: none; }
  .s-day { width: 50px; flex: none; text-align: center; border-radius: 12px; padding: 6px 0; background: var(--surface-2); line-height: 1.15; }
  .s-day b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .s-day small { font-size: 12px; color: var(--muted); }
  .session.today .s-day { background: var(--accent); color: #fff; }
  .session.today .s-day small { color: rgba(255,255,255,.85); }
  .session.done .s-day { background: var(--ok); color: #fff; }
  .session.done .s-day small { color: rgba(255,255,255,.85); }
  .s-title { flex: 1; min-width: 0; }
  .s-title h2 { font-size: 16px; margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .s-title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .chev { color: var(--muted); transition: transform .2s; flex: none; }
  .session.open .chev { transform: rotate(180deg); }
  .s-body { display: none; border-top: 1px solid var(--line); }
  .session.open .s-body { display: block; }

  .daycheck { position: relative; flex: none; width: 34px; height: 34px; }
  .daycheck input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .daycheck span { position: absolute; inset: 0; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; transition: all .15s; }
  .daycheck input:checked + span { background: var(--ok); border-color: var(--ok); }
  .daycheck span svg { opacity: 0; transform: scale(.6); transition: all .15s; }
  .daycheck input:checked + span svg { opacity: 1; transform: scale(1); }
  .daycheck input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* exercises */
  .exw { border-bottom: 1px solid var(--line); }
  .ex { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 64px; }
  .exw.checked { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .ex label.main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .ex input[type=checkbox], .chk {
    appearance: none; -webkit-appearance: none; flex: none; width: 28px; height: 28px; margin: 0;
    border: 2px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: all .12s;
  }
  .ex input[type=checkbox]::after, .chk::after {
    content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px) scale(0); transition: transform .12s;
  }
  .ex input[type=checkbox]:checked, .chk:checked { background: var(--accent); border-color: var(--accent); }
  .ex input[type=checkbox]:checked::after, .chk:checked::after { transform: rotate(45deg) translate(-1px, -1px) scale(1); }
  .ex input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ex .name { font-weight: 600; overflow-wrap: anywhere; }
  .ex .name[data-new]::after { content: attr(data-new); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-left: 6px; vertical-align: 1px; }
  .ex .meta { font-size: 13px; color: var(--muted); }
  .ex .opt { font-style: italic; }
  .exw.checked .name { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
  .setbtn {
    flex: none; width: 76px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font-family: inherit; cursor: pointer; padding: 4px 6px; line-height: 1.15; text-align: center;
  }
  .setbtn b { display: block; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .setbtn small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .setbtn.logged { border-color: var(--accent); background: var(--accent-soft); }
  .setbtn.logged small { color: var(--accent); }
  .setbtn.open { outline: 2px solid var(--accent); outline-offset: 0; }

  .sets-panel { padding: 2px 14px 14px 54px; }
  .sets-panel .last { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .sets-panel .last span { overflow-wrap: anywhere; }
  .setrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .setrow .sn { width: 54px; flex: none; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .setrow .x { color: var(--muted); font-weight: 700; }
  .setrow .numwrap { position: relative; flex: 1; min-width: 0; }
  .setrow input {
    width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font-family: inherit; font-size: 16px; font-weight: 700; padding: 0 34px 0 10px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .setrow input::placeholder { color: var(--muted); font-weight: 500; opacity: .75; }
  .setrow input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .setrow .unit { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); font-weight: 600; pointer-events: none; }
  .setrow.filled input { background: var(--surface); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .sets-panel .btnrow { display: flex; gap: 8px; margin-top: 4px; }
  .sets-panel .btnrow .pill { flex: 1; justify-content: center; height: 40px; }

  .empty-ex { padding: 18px 14px; color: var(--muted); font-size: 14px; text-align: center; border-bottom: 1px solid var(--line); }
  .s-foot { padding: 10px 14px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .s-foot small { color: var(--muted); font-size: 12.5px; flex: 1 1 180px; }
  .s-foot .acts { display: flex; gap: 8px; align-items: center; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 6px 2px; }
  .pill {
    height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.danger { color: var(--danger); background: transparent; }
  .pill.wide { width: 100%; justify-content: center; }
  .pill.small { height: 34px; font-size: 13px; padding: 0 10px; }

  .edit-head { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .field { display: grid; gap: 4px; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .txt, .sel { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-family: inherit; font-size: 16px; padding: 0 12px; }
  .txt:focus, .sel:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .ex-edit { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .ex-edit .fields { flex: 1; min-width: 0; display: grid; gap: 8px; }
  .ex-edit .sub { display: flex; gap: 8px; align-items: center; }
  .ex-edit .sub .txt { flex: 1; min-width: 0; }
  .ex-edit .optlbl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .ex-edit .optlbl .chk { width: 24px; height: 24px; border-radius: 7px; }
  .ex-edit .ctrls { display: grid; gap: 6px; flex: none; }
  .mini { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .mini:disabled { opacity: .35; cursor: default; }
  .mini.del { color: var(--danger); }
  .edit-foot { padding: 12px 14px 14px; display: grid; gap: 10px; }
  .edit-foot .bottom { display: flex; justify-content: space-between; gap: 10px; }

  .add-workout { width: 100%; height: 56px; border-radius: 16px; border: 2px dashed var(--line); background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 14px; }
  .add-workout:hover { border-color: var(--accent); color: var(--accent); }
  .empty-state { text-align: center; padding: 28px 16px 18px; color: var(--muted); }
  .empty-state b { color: var(--text); }
  .empty-state > b:first-child { display: block; font-size: 17px; margin-bottom: 4px; }

  details.info { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; padding: 0 16px; }
  details.info summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.info summary::-webkit-details-marker { display: none; }
  details.info summary::after { content: "+"; font-size: 20px; color: var(--muted); font-weight: 400; }
  details.info[open] summary::after { content: "−"; }
  details.info ul { margin: 0 0 16px; padding-left: 20px; }
  details.info li { margin-bottom: 6px; }
  details.info li b { font-weight: 600; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .tools .icon-btn { font-size: 14px; }
  .note { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 10px; }

  .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); }
  .modal.show { display: flex; }
  .sheet {
    background: var(--surface); color: var(--text); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 22px max(20px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    animation: up .25s ease;
  }
  @media (min-width: 560px) { .modal { align-items: center; } .sheet { border-radius: 22px; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .sheet p.lead { margin: 0 0 18px; color: var(--muted); }
  .sheet .toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet .stepdots { display: flex; gap: 6px; }
  .sheet .stepdots i { width: 22px; height: 5px; border-radius: 99px; background: var(--line); }
  .sheet .stepdots i.on { background: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 13px; padding: 7px 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .choice { display: grid; gap: 10px; margin: 6px 0 18px; }
  .choice label { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .choice label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .choice input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .choice b { display: block; }
  .choice small { color: var(--muted); font-size: 13px; }
  .howto { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 12px; }
  .howto li { display: flex; gap: 12px; align-items: flex-start; }
  .howto .ico { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; font-size: 18px; }
  .howto b { display: block; font-size: 15px; }
  .howto span.d { color: var(--muted); font-size: 13.5px; }
  .howto span.d b { display: inline; font-size: inherit; color: var(--text); }
  .sheet .actions { display: flex; gap: 10px; }
  .sheet .actions .pill { height: 50px; flex: 1; justify-content: center; font-size: 16px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 4px; }

  .sheet.tall { max-width: 640px; }
  .p-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .p-top h2 { margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .stat small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat small.u { display: inline; }
  .stat b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat b.up { color: var(--ok); }
  .chart-wrap { position: relative; margin: 4px 0 6px; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
  .chart-wrap .axis-t { fill: var(--muted); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
  .chart-wrap .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-wrap .area { fill: var(--accent); opacity: .1; }
  .chart-wrap .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .chart-wrap .dot.hl { stroke-width: 3; }
  .chart-wrap .xhair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-wrap .lbl { fill: var(--text); font-size: 12px; font-weight: 700; font-family: inherit; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; line-height: 1.3; }
  .tip b { font-size: 14px; }
  .p-hint { color: var(--muted); font-size: 13px; text-align: center; margin: 2px 0 10px; }
  .p-empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .p-empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .hist-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
  .hist-table th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .hist-table td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .hist-table td.v, .hist-table th.v { text-align: right; }
  .hist-table td.v b { font-variant-numeric: tabular-nums; }
  .hist-table td.v small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .hist-table td.w { color: var(--muted); }
  .p-close { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: 18px; cursor: pointer; flex: none; }

  /* matrix clock (always dark + green, in both themes, so it stands out) */
  header.top > div:first-child { min-width: 0; }
  .hright { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .mclock {
    position: relative; height: 36px; border-radius: 11px; overflow: hidden; display: grid; place-items: center;

<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="hello" id="hello"></p>
      <h1>Gym <span>Tracker</span></h1>
    </div>
    <div class="hright">
      <div class="mclock" id="mclock" role="img">
        <canvas id="mrain" aria-hidden="true"></canvas>
        <span class="mt" aria-hidden="true"><span id="mHM">--:--</span><span class="ms" id="mS">:--</span></span>
      </div>
      <div class="btns">
        <button class="icon-btn" id="progressBtn" data-i18n-aria="progress">📈</button>
        <button class="icon-btn" id="helpBtn" data-i18n-aria="howTo">?</button>
        <button class="icon-btn avatar-btn" id="profileBtn" data-i18n-aria="profile"><span id="avatarInitial">👤</span></button>
      </div>
    </div>
  </header>

  <section class="weekbar">
    <div class="weeknav">
      <button class="icon-btn" id="prevWk" data-i18n-aria="prevWeek">‹</button>
      <div class="label"><b id="wkTitle"></b><small id="wkRange"></small></div>
      <button class="icon-btn" id="nextWk" data-i18n-aria="nextWeek">›</button>
    </div>
    <div class="progress">
      <div class="bar" id="bar"><i></i></div>
      <span class="count" id="count">0/0</span>
    </div>
    <div class="history" id="history"></div>
  </section>

  <div class="nag" id="nag" hidden>
    <div class="nt"><b data-i18n="nagTitle"></b><small id="nagText"></small></div>
    <div class="na"><button class="pill" id="nagLater" type="button" data-i18n="later"></button><button class="pill primary" id="nagBackup" type="button" data-i18n="backupNow"></button></div>
  </div>

  <main id="sessions"></main>
  <button class="add-workout" id="addWorkout" type="button" data-i18n="addWorkout"></button>

  <details class="info">
    <summary data-i18n="installTitle"></summary>
    <p style="margin:0 0 8px" data-i18n="installLead"></p>
    <ul class="install-steps" data-i18n="installSteps"></ul>
  </details>
  <details class="info">
    <summary data-i18n="warmTitle"></summary>
    <ul data-i18n="warmList"></ul>
  </details>
  <details class="info">
    <summary data-i18n="rulesTitle"></summary>
    <ul data-i18n="rulesList"></ul>
  </details>

  <div class="tools">
    <button class="icon-btn" id="todayBtn" data-i18n="jumpWeek"></button>
  </div>
  <p class="note" data-i18n="footNote"></p>
</div>

<div class="toast" id="toast"></div>
<button class="update-bar" id="updateBar" type="button" hidden data-i18n="updateReady"></button>

<div class="timer" id="timer">
  <div class="tbar" id="tbar"></div>
  <div class="timer-in">
    <div class="clock"><small id="tlabel"></small><span id="tclock" aria-live="polite">0:00</span></div>
    <div class="presets" id="presets">
      <button type="button" data-s="60">1:00</button>
      <button type="button" data-s="90">1:30</button>
      <button type="button" data-s="120">2:00</button>
      <button type="button" data-s="180">3:00</button>
    </div>
  </div>
</div>

<!-- Progress -->
<div class="modal" id="progress" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="sheet tall">
    <div class="p-top">
      <h2 id="pTitle" data-i18n="progressTitle"></h2>
      <button class="p-close" id="pClose" type="button" data-i18n-aria="close">✕</button>
    </div>
    <label class="field"><span data-i18n="exercise"></span><select class="sel" id="pSelect"></select></label>
    <div id="pBody"></div>
  </div>
</div>

<!-- Profile -->
<div class="modal" id="profile" role="dialog" aria-modal="true" aria-labelledby="prName">
  <div class="sheet tall">
    <div class="p-top">
      <div class="pr-id">
        <div class="avatar" id="prAvatar"></div>
        <div><h2 id="prName"></h2><small id="prSince"></small></div>
      </div>
      <button class="p-close" id="prClose" type="button" data-i18n-aria="close">✕</button>
    </div>

    <div class="stats pr-stats" id="prStats"></div>
    <p class="pr-fun" id="prFun"></p>

    <h3 class="pr-h" data-i18n="records"></h3>
    <div id="prRecords"></div>

    <h3 class="pr-h" data-i18n="settings"></h3>

      <label class="pr-row"><span data-i18n="nameField"></span>

      </div>
      <div class="pr-row"><span data-i18n="themeLbl"></span>
        <div class="seg" id="prTheme"><button type="button" data-v="auto" data-i18n="themeAuto"></button><button type="button" data-v="light" data-i18n="themeLight"></button><button type="button" data-v="dark" data-i18n="themeDark"></button></div>
      </div>
      <button class="pr-row pr-btn" id="prGuide" type="button"><span data-i18n="howTo"></span><span class="chev-r">›</span></button>
    </div>

    <h3 class="pr-h" data-i18n="dataTitle"></h3>
    <div class="pr-list">
      <button class="pr-row pr-btn" id="exportBtn" type="button"><span><b data-i18n="backup"></b><small data-i18n="backupD"></small></span><span class="chev-r">›</span></button>
      <button class="pr-row pr-btn" id="importBtn" type="button"><span><b data-i18n="restore"></b><small data-i18n="restoreD"></small></span><span class="chev-r">›</span></button>
      <button class="pr-row pr-btn" id="templateBtn" type="button"><span><b data-i18n="loadStarter"></b><small data-i18n="loadStarterD"></small></span><span class="chev-r">›</span></button>

    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="note" data-i18n="localNote"></p>
    <p class="note" id="prStorage"></p>
  </div>
</div>

<!-- Welcome / guide -->
<div class="modal" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
  <div class="sheet">
    <div class="toprow">
      <div class="stepdots" id="stepdots"><i></i><i></i></div>
      <div class="seg" id="langSeg" role="group" aria-label="Language / Jezik">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="sr">SR</button>
      </div>
    </div>

    <div id="step1">
      <h2 id="wTitle"></h2>
      <p class="lead" data-i18n="welcomeLead"></p>
      <label class="field"><span data-i18n="nameLabel"></span>
        <input class="txt" id="nameInput" type="text" maxlength="30" autocomplete="given-name" data-i18n-ph="namePh">
      </label>
      <div class="err" id="nameErr"></div>
      <div id="programChoice">
        <p style="margin:12px 0 4px;font-weight:700" data-i18n="howStart"></p>
        <div class="choice">
          <label><input type="radio" name="start" value="template" checked>
            <span><b data-i18n="starterT"></b><small data-i18n="starterD"></small></span></label>
          <label><input type="radio" name="start" value="empty">
            <span><b data-i18n="ownT"></b><small data-i18n="ownD"></small></span></label>
        </div>
      </div>
      <div class="actions"><button class="pill primary" id="next1" type="button"></button></div>
    </div>

    <div id="step2" hidden>
      <h2 data-i18n="howTitle"></h2>
      <p class="lead" id="guideLead"></p>
      <ul class="howto">
        <li><span class="ico">📅</span><span data-i18n="how1"></span></li>
        <li><span class="ico">✅</span><span data-i18n="how2"></span></li>
        <li><span class="ico">🏋️</span><span data-i18n="how3"></span></li>
        <li><span class="ico">✏️</span><span data-i18n="how4"></span></li>
        <li><span class="ico">⏱️</span><span data-i18n="how5"></span></li>
        <li><span class="ico">💾</span><span data-i18n="how6"></span></li>
      </ul>
      <div class="actions">
        <button class="pill" id="back2" type="button" data-i18n="back"></button>
        <button class="pill primary" id="finish" type="button"></button>
      </div>
    </div>
  </div>
</div>

  function setText(x) {
    const w = String(x.w || "").trim(), r = String(x.r || "").trim();
    if (w && r) return w + "×" + r;
    if (w) return w;
    return r + " " + t("reps");
  }
  const setsText = st => filled(st).map(setText).join(", ");
  function plannedCount(ex) { const m = String(ex.sets || "").match(/^\s*(\d+)/); const n = m ? +m[1] : 3; return Math.min(Math.max(n, 1), 8); }
  function lastSets(sid, exId, beforeKey) {
    const keys = Object.keys(state.weeks).filter(k => k < beforeKey).sort().reverse();
    for (const k of keys) { const st = filled(setsOf(state.weeks[k][sid], exId)); if (st.length) return st; }
    for (const k of keys) for (const sid2 in state.weeks[k]) { const st = filled(setsOf(state.weeks[k][sid2], exId)); if (st.length) return st; }
    return [];
  }

  // ======================================================================
  // Render
  // ======================================================================
  const $ = id => document.getElementById(id);
  const openState = {}, openSets = {};
  const editing = new Set();

  function applyStatic() {
    document.documentElement.lang = lang === "sr" ? "sr-Latn" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
    [...$("langSeg").children].forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    if (!tTick && !timerEl.classList.contains("finished")) $("tlabel").textContent = t("rest");
  }

  function render() {
    const key = weekKey(viewMonday), w = isoWeek(viewMonday), isThisWeek = sameDay(viewMonday, thisMonday);
    $("hello").textContent = state.name ? t("hello", { name: state.name }) : "";
    $("avatarInitial").textContent = state.name ? state.name.trim().charAt(0).toUpperCase() : "👤";
    $("wkTitle").textContent = isThisWeek ? t("thisWeek", { w: w.week }) : t("weekOf", { w: w.week, y: w.year });
    $("wkRange").textContent = fmtShort(viewMonday) + " – " + fmtShort(addDays(viewMonday, 6));
    const total = program().length, n = doneCount(key);
    $("count").textContent = n + "/" + total;
    $("bar").firstElementChild.style.width = (total ? n / total * 100 : 0) + "%";
    $("bar").classList.toggle("full", total > 0 && n === total);
    renderHistory(key);
    renderNag();

    const container = $("sessions");
    container.innerHTML = "";
    if (!total) { container.innerHTML = '<div class="empty-state">' + t("noWorkouts") + '</div>'; return; }
    const todayDow = (today.getDay() + 6) % 7;
    sorted().forEach(sess => container.appendChild(renderSession(sess, key, isThisWeek, todayDow)));
  }

  function renderSession(sess, key, isThisWeek, todayDow) {
    const sd = sessionData(key, sess.id, false);
    const D = t("days");
    const hasAlt = sess.altDow != null && sess.altDow !== sess.dow;
    const isToday = isThisWeek && (todayDow === sess.dow || (hasAlt && todayDow === sess.altDow && !sd.done));
    const openKey = key + ":" + sess.id;
    if (openState[openKey] === undefined) openState[openKey] = isToday;
    const isEditing = editing.has(sess.id);
    const open = openState[openKey] || isEditing;
    const title = tr("w", sess.id, "title", sess.title) || t("untitled");
    const sub = tr("w", sess.id, "sub", sess.sub);

    const date = addDays(viewMonday, sess.dow);
    const el = document.createElement("article");
    el.className = "session" + (isToday ? " today" : "") + (sd.done ? " done" : "") + (open ? " open" : "");
    el.dataset.sid = sess.id;

    const required = sess.ex.filter(e => !e.optional);
    const checkedReq = required.filter(e => sd.ex[e.id]).length;
    const dayB = hasAlt ? D[sess.dow].charAt(0) + "/" + D[sess.altDow].charAt(0) : D[sess.dow];
    const daySmall = hasAlt ? date.getDate() + "/" + addDays(viewMonday, sess.altDow).getDate() : fmtShort(date);
    const flex = hasAlt ? '<span class="tag">' + esc(t("orDay", { a: D[sess.dow], b: D[sess.altDow] })) + '</span>' : "";

    el.innerHTML =
      '<div class="s-head" role="button" tabindex="0" aria-expanded="' + open + '">' +
        '<div class="s-day"><b>' + esc(dayB) + '</b><small>' + esc(daySmall) + '</small></div>' +
        '<div class="s-title"><h2>' + esc(title) + flex + '</h2>' +
        '<p>' + (sub ? esc(sub) + " · " : "") + esc(t("doneCount", { a: checkedReq, b: required.length })) + '</p></div>' +
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '<label class="daycheck" title="' + esc(t("markDone")) + '"><input type="checkbox" aria-label="' + esc(t("markDone")) + '"' + (sd.done ? " checked" : "") + '><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></label>' +
      '</div><div class="s-body"></div>';

    const body = el.querySelector(".s-body");
    if (isEditing) renderEditBody(body, sess); else renderTrackBody(body, sess, key, sd);

    const head = el.querySelector(".s-head");
    const toggle = () => { if (isEditing) return; openState[openKey] = !openState[openKey]; render(); };
    head.addEventListener("click", e => { if (e.target.closest(".daycheck")) return; toggle(); });
    head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    const dc = el.querySelector(".daycheck input");
    dc.addEventListener("click", e => e.stopPropagation());
    dc.addEventListener("change", e => {
      const s = sessionData(key, sess.id, true);
      s.done = e.target.checked;
      if (s.done) toast(t("toastDone"));
      save(); render();
    });
    return el;
  }

  function maybeCompleteSession(key, sess) {
    const s = sessionData(key, sess.id, true);
    const req = sess.ex.filter(x => !x.optional);
    if (req.length && req.every(x => s.ex[x.id]) && !s.done) { s.done = true; toast(t("toastDone")); return true; }
    return false;
  }

  function renderTrackBody(body, sess, key, sd) {
    if (!sess.ex.length) {
      const empty = document.createElement("div"); empty.className = "empty-ex"; empty.textContent = t("noExercises"); body.appendChild(empty);
    }
    sess.ex.forEach(ex => {
      const wrap = document.createElement("div");
      const checked = !!sd.ex[ex.id];
      wrap.className = "exw" + (checked ? " checked" : "");
      const inputId = key + "-" + sess.id + "-" + ex.id;
      const setsKey = key + ":" + sess.id + ":" + ex.id;
      wrap.innerHTML =
        '<div class="ex"><label class="main" for="' + esc(inputId) + '">' +
          '<input type="checkbox" id="' + esc(inputId) + '"' + (checked ? " checked" : "") + '>' +
          '<span><span class="name"></span><br><span class="meta"></span></span>' +
        '</label><button class="setbtn" type="button"><b></b><small></small></button></div>';
      const nm = wrap.querySelector(".name");
      nm.textContent = tr("e", ex.id, "name", ex.name) || t("unnamedEx");
      if (ex.isNew) nm.dataset.new = t("newTag");
      const meta = wrap.querySelector(".meta");
      meta.textContent = [tr("e", ex.id, "sets", ex.sets), ex.optional ? t("optional") : ""].filter(Boolean).join(" · ");
      if (ex.optional) meta.classList.add("opt");

      const btn = wrap.querySelector(".setbtn");
      const last = lastSets(sess.id, ex.id, key);
      function updateBtn() {
        const st = filled(setsOf(sessionData(key, sess.id, false), ex.id));
        const b = bestSet(st);
        btn.classList.toggle("logged", !!st.length);
        btn.classList.toggle("open", !!openSets[setsKey]);
        if (st.length) {
          btn.querySelector("b").textContent = b ? (String(b.w || "").trim() || (String(b.r || "").trim() + "×")) : "✓";
          btn.querySelector("small").textContent = st.length + " " + setsWord(st.length);
        } else {
          btn.querySelector("b").textContent = "+";
          const lb = bestSet(last);
          btn.querySelector("small").textContent = lb && String(lb.w || "").trim() ? t("last", { v: String(lb.w).trim() }) : t("log");
        }
        btn.setAttribute("aria-expanded", !!openSets[setsKey]);
      }
      updateBtn();
      btn.addEventListener("click", () => { openSets[setsKey] = !openSets[setsKey]; render(); });

      wrap.querySelector("input[type=checkbox]").addEventListener("change", e => {
        buzz(15);
        const s = sessionData(key, sess.id, true);
        s.ex[ex.id] = e.target.checked;
        maybeCompleteSession(key, sess);
        save(); render();
      });

      if (openSets[setsKey]) wrap.appendChild(renderSetsPanel(sess, ex, key, last, updateBtn, wrap));
      body.appendChild(wrap);
    });

    const foot = document.createElement("div");
    foot.className = "s-foot";
    foot.innerHTML = '<small></small><div class="acts"><button class="linkbtn" type="button" data-a="clear"></button>' +
      '<button class="pill" type="button" data-a="prog">📈</button><button class="pill" type="button" data-a="edit"></button></div>';
    foot.querySelector("small").textContent = t("footHint");
    foot.querySelector('[data-a="clear"]').textContent = t("clearTicks");
    foot.querySelector('[data-a="edit"]').textContent = t("edit");
    const pb = foot.querySelector('[data-a="prog"]'); pb.setAttribute("aria-label", t("progressFor")); pb.title = t("progressFor");
    pb.addEventListener("click", () => openProgress(sess));
    foot.querySelector('[data-a="clear"]').addEventListener("click", () => {
      if (!confirm(t("clearConfirm", { t: tr("w", sess.id, "title", sess.title) || t("untitled") }))) return;
      delete weekData(key, true)[sess.id]; save(); render();
    });
    foot.querySelector('[data-a="edit"]').addEventListener("click", () => { editing.add(sess.id); render(); });
    body.appendChild(foot);
  }

  function renderSetsPanel(sess, ex, key, last, updateBtn, wrap) {
    const panel = document.createElement("div");
    panel.className = "sets-panel";
    const sd = sessionData(key, sess.id, false);
    let cur = setsOf(sd, ex.id).map(x => ({ w: x.w || "", r: x.r || "" }));
    const count = Math.max(cur.length, cur.length ? 0 : Math.max(plannedCount(ex), last.length));
    while (cur.length < count) cur.push({ w: "", r: "" });

    function persist() {
      const s = sessionData(key, sess.id, true);
      s.sets[ex.id] = cur.map(x => ({ w: String(x.w).trim(), r: String(x.r).trim() }));
      const b = bestSet(s.sets[ex.id]);
      if (b && String(b.w || "").trim()) s.w[ex.id] = String(b.w).trim(); else delete s.w[ex.id];
      save();
    }

    if (last.length) {
      const lr = document.createElement("div"); lr.className = "last";
      lr.innerHTML = '<span></span><button class="pill small" type="button"></button>';
      lr.querySelector("span").textContent = t("lastTime", { s: setsText(last) });
      lr.querySelector("button").textContent = t("sameAsLast");
      lr.querySelector("button").addEventListener("click", () => {
        cur = last.map(x => ({ w: x.w || "", r: x.r || "" }));
        persist(); autoTick(); render();
      });
      panel.appendChild(lr);
    }

    const rowsEl = document.createElement("div");
    panel.appendChild(rowsEl);
    function phW(i) { return (last[i] && String(last[i].w || "").trim()) || (i > 0 && String(cur[i - 1].w || "").trim()) || t("kg"); }
    function phR(i) { return (last[i] && String(last[i].r || "").trim()) || (i > 0 && String(cur[i - 1].r || "").trim()) || t("reps"); }
    function drawRows() {
      rowsEl.innerHTML = "";
      cur.forEach((x, i) => {
        const row = document.createElement("div");
        row.className = "setrow" + ((String(x.w).trim() || String(x.r).trim()) ? " filled" : "");
        row.innerHTML = '<span class="sn"></span>' +
          '<span class="numwrap"><input type="text" inputmode="decimal" data-k="w"><span class="unit"></span></span>' +
          '<span class="x">×</span>' +
          '<span class="numwrap"><input type="text" inputmode="numeric" data-k="r"><span class="unit"></span></span>';
        row.querySelector(".sn").textContent = t("set", { n: i + 1 });
        const [wi, ri] = row.querySelectorAll("input");
        const units = row.querySelectorAll(".unit");
        units[0].textContent = t("kg"); units[1].textContent = t("reps");
        wi.value = x.w; ri.value = x.r;
        wi.placeholder = phW(i); ri.placeholder = phR(i);
        wi.setAttribute("aria-label", t("set", { n: i + 1 }) + " " + t("weight"));
        ri.setAttribute("aria-label", t("set", { n: i + 1 }) + " " + t("repsCol"));
        [wi, ri].forEach(inp => {
          inp.addEventListener("input", () => {
            cur[i][inp.dataset.k] = inp.value;
            row.classList.toggle("filled", !!(String(cur[i].w).trim() || String(cur[i].r).trim()));
            persist(); updateBtn();
            const next = rowsEl.children[i + 1];
            if (next) { const ni = next.querySelectorAll("input"); ni[0].placeholder = phW(i + 1); ni[1].placeholder = phR(i + 1); }
          });
          inp.addEventListener("change", () => { if (autoTick()) render(); });
        });
        rowsEl.appendChild(row);
      });
    }
    // Tick the exercise once every set row has something in it.
    function autoTick() {
      const s = sessionData(key, sess.id, true);
      if (s.ex[ex.id] || !cur.length || filled(cur).length !== cur.length) return false;
      s.ex[ex.id] = true; buzz(15);
      wrap.classList.add("checked");
      const cb = wrap.querySelector(".ex input[type=checkbox]"); if (cb) cb.checked = true;
      maybeCompleteSession(key, sess);
      save(); return true;
    }
    drawRows();

    const br = document.createElement("div"); br.className = "btnrow";
    br.innerHTML = '<button class="pill" type="button" data-a="rm"></button><button class="pill" type="button" data-a="add"></button>';
    br.querySelector('[data-a="rm"]').textContent = t("removeSet");
    br.querySelector('[data-a="add"]').textContent = t("addSet");
    br.querySelector('[data-a="add"]').addEventListener("click", () => {
      cur.push({ w: "", r: "" }); persist(); drawRows(); updateBtn();
      const ins = rowsEl.lastElementChild.querySelectorAll("input"); ins[0].focus();
    });
    br.querySelector('[data-a="rm"]').addEventListener("click", () => {
      if (cur.length <= 1) return;
      cur.pop(); persist(); drawRows(); updateBtn();
    });
    panel.appendChild(br);
    return panel;
  }

  function daySelect(value, withNone) {
    let h = withNone ? '<option value="">' + esc(t("noOtherDay")) + '</option>' : "";
    t("daysLong").forEach((d, i) => { h += '<option value="' + i + '"' + (value === i ? " selected" : "") + '>' + esc(d) + '</option>'; });
    return h;
  }

  function renderEditBody(body, sess) {
    const headEl = document.createElement("div");
    headEl.className = "edit-head";
    headEl.innerHTML =
      '<label class="field"><span></span><input class="txt" data-f="title" maxlength="40"></label>' +
      '<label class="field"><span></span><input class="txt" data-f="sub" maxlength="60"></label>' +
      '<div class="row2">' +
        '<label class="field"><span></span><select class="sel" data-f="dow">' + daySelect(sess.dow, false) + '</select></label>' +
        '<label class="field"><span></span><select class="sel" data-f="altDow">' + daySelect(sess.altDow == null ? null : sess.altDow, true) + '</select></label>' +
      '</div>';
    const labels = headEl.querySelectorAll(".field > span");
    labels[0].textContent = t("workoutName"); labels[1].textContent = t("desc"); labels[2].textContent = t("day"); labels[3].textContent = t("altDay");
    const ti = headEl.querySelector('[data-f="title"]'), su = headEl.querySelector('[data-f="sub"]');
    ti.placeholder = t("workoutNamePh"); su.placeholder = t("descPh");
    ti.value = tr("w", sess.id, "title", sess.title) || ""; su.value = tr("w", sess.id, "sub", sess.sub) || "";
    ti.addEventListener("input", () => { sess.title = ti.value; save(); });
    su.addEventListener("input", () => { sess.sub = su.value; save(); });

    headEl.querySelector('[data-f="altDow"]').addEventListener("change", e => { sess.altDow = e.target.value === "" ? null : +e.target.value; if (sess.altDow === sess.dow) sess.altDow = null; save(); render(); });
    body.appendChild(headEl);

    sess.ex.forEach((ex, i) => {
      const row = document.createElement("div");
      row.className = "ex-edit";
      row.innerHTML =
        '<div class="fields"><input class="txt" data-f="name" maxlength="60">' +
          '<div class="sub"><input class="txt" data-f="sets" maxlength="30"><label class="optlbl"><input type="checkbox" class="chk" data-f="optional"><span></span></label></div></div>' +
        '<div class="ctrls"><button class="mini" type="button" data-a="up"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
          '<button class="mini" type="button" data-a="down"' + (i === sess.ex.length - 1 ? " disabled" : "") + '>↓</button>' +
          '<button class="mini del" type="button" data-a="del">✕</button></div>';
      const nameI = row.querySelector('[data-f="name"]'), setsI = row.querySelector('[data-f="sets"]'), optI = row.querySelector('[data-f="optional"]');
      nameI.placeholder = t("exNamePh"); nameI.setAttribute("aria-label", t("exNamePh"));
      setsI.placeholder = t("setsPh"); setsI.setAttribute("aria-label", t("setsPh"));
      row.querySelector(".optlbl span").textContent = t("optionalLbl");
      row.querySelector('[data-a="up"]').setAttribute("aria-label", t("moveUp"));
      row.querySelector('[data-a="down"]').setAttribute("aria-label", t("moveDown"));
      row.querySelector('[data-a="del"]').setAttribute("aria-label", t("removeEx"));
      nameI.value = tr("e", ex.id, "name", ex.name) || ""; setsI.value = tr("e", ex.id, "sets", ex.sets) || ""; optI.checked = !!ex.optional;
      nameI.addEventListener("input", () => { ex.name = nameI.value; save(); });
      setsI.addEventListener("input", () => { ex.sets = setsI.value; save(); });
      optI.addEventListener("change", () => { ex.optional = optI.checked; save(); });
      row.querySelector('[data-a="up"]').addEventListener("click", () => { move(sess.ex, i, -1); save(); render(); });
      row.querySelector('[data-a="down"]').addEventListener("click", () => { move(sess.ex, i, 1); save(); render(); });
      row.querySelector('[data-a="del"]').addEventListener("click", () => {
        const nm = tr("e", ex.id, "name", ex.name);
        if (nm && !confirm(t("removeConfirm", { n: nm }))) return;
        sess.ex.splice(i, 1); save(); render();
      });
      body.appendChild(row);
    });

    const foot = document.createElement("div");
    foot.className = "edit-foot";
    foot.innerHTML = '<button class="pill wide" type="button" data-a="add"></button>' +
      '<div class="bottom"><button class="pill danger" type="button" data-a="delw"></button><button class="pill primary" type="button" data-a="done"></button></div>';
    foot.querySelector('[data-a="add"]').textContent = t("addExercise");
    foot.querySelector('[data-a="delw"]').textContent = t("deleteWorkout");
    foot.querySelector('[data-a="done"]').textContent = t("done");
    foot.querySelector('[data-a="add"]').addEventListener("click", () => {
      sess.ex.push({ id: uid("ex"), name: "", sets: "" }); save(); render();
      const rows = document.querySelectorAll('.session[data-sid="' + sess.id + '"] .ex-edit [data-f="name"]');
      if (rows.length) rows[rows.length - 1].focus();
    });
    foot.querySelector('[data-a="delw"]').addEventListener("click", () => {
      if (!confirm(t("deleteConfirm", { t: tr("w", sess.id, "title", sess.title) || t("untitled") }))) return;
      state.program = program().filter(s => s.id !== sess.id); editing.delete(sess.id); save(); render();
    });
    foot.querySelector('[data-a="done"]').addEventListener("click", () => {
      sess.ex = sess.ex.filter(e => (e.name || "").trim() || (e.sets || "").trim());
      sess.ex.forEach(e => { e.name = (e.name || "").trim(); e.sets = (e.sets || "").trim(); });
      sess.title = (sess.title || "").trim() || t("untitled");
      sess.sub = (sess.sub || "").trim();
      editing.delete(sess.id); save(); render();
    });
    body.appendChild(foot);
  }
  function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

  function renderHistory(curKey) {
    const h = $("history");
    h.innerHTML = '<span class="hlabel"></span>';
    h.firstChild.textContent = t("last8");
    const total = program().length;
    for (let i = 7; i >= 0; i--) {
      const m = addDays(thisMonday, -7 * i), k = weekKey(m), n = doneCount(k);
      const ratio = total ? n / total : 0;
      const lvl = !n ? "" : ratio >= 1 ? " l4" : ratio >= .66 ? " l3" : ratio >= .33 ? " l2" : " l1";
      const b = document.createElement("button");
      b.className = "wk" + lvl + (k === curKey ? " cur" : "");
      b.textContent = n || "";
      b.title = t("weekTip", { w: isoWeek(m).week, n, t: total });
      b.addEventListener("click", () => { viewMonday = m; render(); });
      h.appendChild(b);
    }
  }

  $("addWorkout").addEventListener("click", () => {
    if (!Array.isArray(state.program)) state.program = [];
    const used = new Set(program().map(s => s.dow));
    let dow = (today.getDay() + 6) % 7;
    for (let i = 0; i < 7 && used.has(dow); i++) dow = (dow + 1) % 7;
    const sess = { id: uid("w"), dow, altDow: null, title: "", sub: "", ex: [{ id: uid("ex"), name: "", sets: "" }] };
    state.program.push(sess); editing.add(sess.id); save(); render();
    const el = document.querySelector('.session[data-sid="' + sess.id + '"]');
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); const ti = el.querySelector('[data-f="title"]'); if (ti) ti.focus({ preventScroll: true }); }
  });

  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  let toastTimer;
  function toast(msg) {
    buzz([40, 60, 40]);
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  // ======================================================================
  // Rest timer
  // ======================================================================
  let tEnd = 0, tTotal = 0, tTick = null;
  const timerEl = $("timer");
  const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  function stopTimer(finished) {
    clearInterval(tTick); tTick = null;
    timerEl.classList.remove("running"); $("tbar").style.width = "0";
    [...$("presets").children].forEach(b => b.classList.remove("stop"));
    if (finished) {
      timerEl.classList.add("finished"); $("tlabel").textContent = t("go"); $("tclock").textContent = "0:00";

  function niceStep(range, target) { const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag; }

  function renderProgress() {
    const body = $("pBody"); body.innerHTML = "";
    if (!pExId) { body.innerHTML = '<div class="p-empty">' + t("nothing") + '</div>'; return; }
    const all = entriesFor(pExId);
    // Metric: weight if any weight was logged, otherwise reps (e.g. pull-ups).
    const useW = all.some(p => p.w != null);
    const val = p => useW ? p.w : p.r;
    const unit = useW ? (all.filter(p => /lb/i.test(p.best && p.best.w)).length > all.length / 2 ? "lb" : t("kg")) : t("reps");
    const byWeek = new Map();
    all.filter(p => val(p) != null).forEach(p => {
      const k = weekKey(startOfWeek(p.date)), cur = byWeek.get(k);
      if (!cur) byWeek.set(k, Object.assign({ count: 1 }, p));
      else { cur.count++; if (val(p) > val(cur)) Object.assign(cur, p, { count: cur.count }); }
    });
    const pts = [...byWeek.values()].sort((a, b) => a.date - b.date);
    if (!pts.length) { body.innerHTML = '<div class="p-empty">' + t("noLogs") + '</div>'; return; }

    const first = val(pts[0]), last = val(pts[pts.length - 1]), best = Math.max(...pts.map(val)), diff = last - first;
    const stats = document.createElement("div"); stats.className = "stats";
    const statHtml = (label, v, cls) => '<div class="stat"><small>' + esc(label) + '</small><b class="' + (cls || "") + '">' + v + '</b> <small class="u">' + esc(unit) + '</small></div>';
    stats.innerHTML = statHtml(t("latest"), fmtNum(last)) + statHtml(t("best"), fmtNum(best)) + statHtml(t("sinceStart"), (diff > 0 ? "+" : "") + fmtNum(diff), diff > 0 ? "up" : "");
    body.appendChild(stats);

    const wrap = document.createElement("div"); wrap.className = "chart-wrap"; body.appendChild(wrap);
    const W = Math.max(280, Math.round(wrap.clientWidth || 320)), H = 210, pad = { l: 38, r: 18, t: 22, b: 26 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const vals = pts.map(val);
    let lo = Math.min(...vals), hi = best;
    if (hi - lo < 1e-9) { lo -= useW ? 5 : 2; hi += useW ? 5 : 2; }
    const step = niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (lo === hi) hi = lo + step;
    if (lo < 0 && Math.min(...vals) >= 0) lo = 0;
    const t0 = pts[0].date.getTime(), t1 = pts[pts.length - 1].date.getTime();
    const x = d => pts.length === 1 || t1 === t0 ? pad.l + iw / 2 : pad.l + (d.getTime() - t0) / (t1 - t0) * iw;
    const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * ih;
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, a, text) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; return e; };
    const svg = mk("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img",
      "aria-label": t("chartAria", { metric: useW ? t("weight") : t("repsCol"), n: pts.length, v: fmtNum(last) + " " + unit }) });
    for (let v = lo; v <= hi + step / 2; v += step) {
      svg.appendChild(mk("line", { class: "grid", x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v) }));
      svg.appendChild(mk("text", { class: "axis-t", x: pad.l - 8, y: y(v) + 4, "text-anchor": "end" }, fmtNum(v)));
    }
    const xIdx = pts.length === 1 ? [0] : pts.length < 5 ? [0, pts.length - 1] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    xIdx.forEach((i, k) => {
      const anchor = xIdx.length === 1 ? "middle" : k === 0 ? "start" : k === xIdx.length - 1 ? "end" : "middle";
      svg.appendChild(mk("text", { class: "axis-t", x: x(pts[i].date), y: H - 6, "text-anchor": anchor }, fmtShort(pts[i].date)));
    });
    if (pts.length > 1) {
      const d = pts.map((p, i) => (i ? "L" : "M") + x(p.date).toFixed(1) + " " + y(val(p)).toFixed(1)).join(" ");
      svg.appendChild(mk("path", { class: "area", d: d + " L" + x(pts[pts.length - 1].date).toFixed(1) + " " + (pad.t + ih) + " L" + x(pts[0].date).toFixed(1) + " " + (pad.t + ih) + " Z" }));
      svg.appendChild(mk("path", { class: "line", d }));
    }
    const xh = mk("line", { class: "xhair", y1: pad.t, y2: pad.t + ih, x1: -10, x2: -10, visibility: "hidden" }); svg.appendChild(xh);
    const rr = pts.length > 30 ? 3 : 4.5;
    const dots = pts.map(p => { const c = mk("circle", { class: "dot", cx: x(p.date), cy: y(val(p)), r: rr }); svg.appendChild(c); return c; });
    const lp = pts[pts.length - 1];
    const lbl = mk("text", { class: "lbl", x: x(lp.date), y: y(val(lp)) - 10, "text-anchor": pts.length === 1 ? "middle" : "end" }, fmtNum(val(lp)) + " " + unit);
    svg.appendChild(lbl);
    wrap.appendChild(svg);

    const tip = document.createElement("div"); tip.className = "tip"; wrap.appendChild(tip);
    let hl = -1;
    function show(i) {
      if (hl >= 0) { dots[hl].classList.remove("hl"); dots[hl].setAttribute("r", rr); }
      hl = i;
      if (i < 0) { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); lbl.setAttribute("visibility", "visible"); return; }
      const p = pts[i], scale = wrap.clientWidth / W;
      dots[i].classList.add("hl"); dots[i].setAttribute("r", 6.5);
      xh.setAttribute("x1", x(p.date)); xh.setAttribute("x2", x(p.date)); xh.setAttribute("visibility", "visible");
      lbl.setAttribute("visibility", "hidden");
      tip.innerHTML = "<b></b><br><span></span>";
      tip.querySelector("b").textContent = setText(p.best);
      tip.querySelector("span").textContent = fmtShort(p.date) + " · " + p.workout + (p.count > 1 ? " · " + t("bestOf", { n: p.count }) : "");
      tip.style.display = "block";
      const tw = tip.offsetWidth, cx = x(p.date) * scale;
      tip.style.left = Math.min(Math.max(cx, tw / 2), wrap.clientWidth - tw / 2) + "px";
      tip.style.top = (y(val(p)) * scale - 8) + "px";
    }
    function nearest(clientX) {
      const r = svg.getBoundingClientRect(), s = (clientX - r.left) * (W / r.width);
      let bi = 0, bd = Infinity; pts.forEach((p, i) => { const dd = Math.abs(x(p.date) - s); if (dd < bd) { bd = dd; bi = i; } }); return bi;
    }
    svg.addEventListener("pointermove", e => show(nearest(e.clientX)));
    svg.addEventListener("pointerdown", e => show(nearest(e.clientX)));
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });

    const hint = document.createElement("p"); hint.className = "p-hint";
    hint.textContent = pts.length === 1 ? t("hintOne") : t("hintMany");
    body.appendChild(hint);

    const tbl = document.createElement("table"); tbl.className = "hist-table";
    tbl.innerHTML = '<thead><tr><th></th><th></th><th class="v"></th></tr></thead><tbody></tbody>';
    const ths = tbl.querySelectorAll("th"); ths[0].textContent = t("date"); ths[1].textContent = t("workout"); ths[2].textContent = useW ? t("weight") : t("repsCol");
    const tb = tbl.querySelector("tbody");
    all.slice().reverse().forEach(p => {
      const tr_ = document.createElement("tr");
      tr_.innerHTML = '<td></td><td class="w"></td><td class="v"><b></b><small></small></td>';
      tr_.children[0].textContent = fmtLong(p.date);
      tr_.children[1].textContent = p.workout;
      tr_.querySelector("b").textContent = p.best ? setText(p.best) : "";
      if (p.sets.length > 1) tr_.querySelector("small").textContent = setsText(p.sets);
      tb.appendChild(tr_);
    });
    body.appendChild(tbl);
  }

  // ======================================================================
  // Profile
  // ======================================================================
  function allSessionRecords() {
    const out = [];
    Object.keys(state.weeks).sort().forEach(wk => {
      const m = /^(\d{4})-W(\d{2})$/.exec(wk); if (!m) return;
      const monday = mondayOfIsoWeek(+m[1], +m[2]);
      for (const sid in state.weeks[wk]) out.push({ wk, monday, sid, s: state.weeks[wk][sid] });
    });
    return out;
  }
  function hasActivity(s) {
    if (!s) return false;
    if (s.done || Object.values(s.ex || {}).some(Boolean)) return true;
    return Object.keys(s.sets || {}).some(k => filled(s.sets[k]).length) || Object.values(s.w || {}).some(v => String(v || "").trim());
  }
  function computeStats() {
    const recs = allSessionRecords();
    const byId = {}; program().forEach(s => { byId[s.id] = s; });
    const thisKey = weekKey(thisMonday);
    let workouts = 0, workoutsWeek = 0, sets = 0, setsWeek = 0, volume = 0, firstDate = null;
    const doneWeeks = new Set();
    const exSeen = {}; // exercise id -> name (from program, or anything with data)
    program().forEach(s => s.ex.forEach(e => { if (!exSeen[e.id] && e.name) exSeen[e.id] = tr("e", e.id, "name", e.name); }));
    const prs = {};
    recs.forEach(({ wk, monday, sid, s }) => {
      if (!s) return;
      if (hasActivity(s) && (!firstDate || monday < firstDate)) firstDate = monday;
      if (s.done) { workouts++; doneWeeks.add(wk); if (wk === thisKey) workoutsWeek++; }
      const ids = new Set([...Object.keys(s.sets || {}), ...Object.keys(s.w || {})]);
      ids.forEach(exId => {
        const st = filled(setsOf(s, exId));
        sets += st.length; if (wk === thisKey) setsWeek += st.length;
        st.forEach(x => { const w = num(x.w), r = num(x.r); if (w != null && r != null && w > 0 && r > 0) volume += w * r; });
        const b = bestSet(st);
        if (b && num(b.w) != null && exSeen[exId]) {
          const w = num(b.w), cur = prs[exId];
          const date = addDays(monday, byId[sid] ? byId[sid].dow : 0);
          if (!cur || w > cur.w || (w === cur.w && (num(b.r) || 0) > (num(cur.set.r) || 0))) prs[exId] = { id: exId, w, set: b, date, name: exSeen[exId] };
        }
      });
    });
    // Week streaks: consecutive weeks with at least one finished workout.
    let best = 0, run = 0, prev = null;
    [...doneWeeks].sort().forEach(k => {
      const m = /^(\d{4})-W(\d{2})$/.exec(k), mon = mondayOfIsoWeek(+m[1], +m[2]);
      run = prev && Math.round((mon - prev) / 864e5) === 7 ? run + 1 : 1;
      best = Math.max(best, run); prev = mon;
    });
    let current = 0, wkMon = doneWeeks.has(thisKey) ? thisMonday : addDays(thisMonday, -7);
    while (doneWeeks.has(weekKey(wkMon))) { current++; wkMon = addDays(wkMon, -7); }
    const records = Object.values(prs).sort((a, b) => b.w - a.w).slice(0, 8);
    return { workouts, workoutsWeek, sets, setsWeek, volume, firstDate, current, best, records };
  }

  $("wipeBtn").addEventListener("click", () => {
    if (!confirm(t("wipeConfirm"))) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = { weeks: {} }; editing.clear(); closeProfile(); render(); openWelcome("first");
  });

  // ======================================================================
  // Controls
  // ======================================================================
  $("helpBtn").addEventListener("click", () => openWelcome("guide"));
  $("prevWk").addEventListener("click", () => { viewMonday = addDays(viewMonday, -7); render(); });
  $("nextWk").addEventListener("click", () => { viewMonday = addDays(viewMonday, 7); render(); });
  $("todayBtn").addEventListener("click", () => { viewMonday = new Date(thisMonday); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("templateBtn").addEventListener("click", () => {
    if (program().length && !confirm(t("replaceConfirm"))) return;
    state.program = starterProgram(); editing.clear(); save(); render(); renderProfile(); toast(t("starterLoaded"));
  });
  // Phones: open the share sheet (save to Files / Drive / send to yourself). Computers: download.
  async function exportBackup() {
    const fname = "gym-tracker-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    const json = JSON.stringify(state, null, 2);
    const done = () => { state.lastBackup = Date.now(); save(); renderNag(); if ($("profile").classList.contains("show")) renderProfile(); toast(t("backupSaved")); };
    const touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (touch && typeof File === "function" && navigator.canShare) {
      try {
        const file = new File([json], fname, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fname }); done(); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    done();
  }
  $("exportBtn").addEventListener("click", exportBackup);

  // ======================================================================
  // Backup reminder
  // ======================================================================
  const DAY = 864e5;
  function firstActivity() {
    let first = null;
    Object.keys(state.weeks).forEach(wk => {
      const m = /^(\d{4})-W(\d{2})$/.exec(wk); if (!m) return;
      const w = state.weeks[wk];
      if (Object.values(w).some(hasActivity)) { const mon = mondayOfIsoWeek(+m[1], +m[2]); if (!first || mon < first) first = mon; }
    });
    return first;
  }
  // Show when: there is real data, and no backup yet after 2 weeks of use, or the last one is > 30 days old.
  function renderNag() {
    const now = Date.now();
    let show = false, text = "";
    if (state.onboarded && !(state.backupSnooze > now)) {
      const first = firstActivity();
      if (first) {
        if (!state.lastBackup) { show = now - first.getTime() >= 14 * DAY; text = t("nagNever"); }
        else { show = now - state.lastBackup >= 30 * DAY; text = t("nagOld", { d: fmtLong(new Date(state.lastBackup)) }); }
      }
    }
    $("nag").hidden = !show;
    if (show) $("nagText").textContent = text;
  }
  $("nagBackup").addEventListener("click", exportBackup);
  $("nagLater").addEventListener("click", () => { state.backupSnooze = Date.now() + 7 * DAY; save(); renderNag(); });

  // ======================================================================
  // Matrix clock (header)
  // ======================================================================
  (function matrixClock() {
    const pad = n => String(n).padStart(2, "0");
    function tick() {
      const d = new Date();
      $("mHM").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
      $("mS").textContent = ":" + pad(d.getSeconds());
      $("mclock").setAttribute("aria-label", pad(d.getHours()) + ":" + pad(d.getMinutes()));
      setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    }
    tick();

    // Falling green characters behind the time. Skipped if the phone asks for reduced motion.
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("mrain"), ctx = cv.getContext("2d");
    const CHARS = "01アカサタナハマヤラワ23456789ｱｲｳｴｵ";
    const COL = 7;
    let cols = [], w = 0, h = 0, dpr = 1, last = 0;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      if (!w || !h) return;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Array.from({ length: Math.ceil(w / COL) }, () => Math.random() * -h);
      ctx.font = "8px monospace";
    }
    function frame(ts) {
      requestAnimationFrame(frame);
      if (document.hidden || ts - last < 70) return; // ~14 fps is plenty and easy on battery
      last = ts;
      if (!w) { size(); if (!w) return; }
      ctx.fillStyle = "rgba(2, 6, 4, 0.22)";
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < cols.length; i++) {
        const y = cols[i];
        ctx.fillStyle = Math.random() < 0.08 ? "#c8ffe0" : "#2bd673";
        ctx.fillText(CHARS[(Math.random() * CHARS.length) | 0], i * COL, y);
        cols[i] = y > h + Math.random() * 40 ? Math.random() * -20 : y + 6;
      }
    }
    window.addEventListener("resize", size);
    size();
    requestAnimationFrame(frame);
  })();

  // ======================================================================
  // Offline, storage protection, updates
  // ======================================================================
  let storageProtected = null;
  function protectStorage() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { storageProtected = !!p; }).catch(() => {});
    } catch (e) {}
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  // When the app comes back to the screen, check (at most every 30 min) whether a newer version is live.
  let lastCheck = Date.now();
  async function checkForUpdate() {
    if (!navigator.onLine || Date.now() - lastCheck < 30 * 60 * 1000) return;
    lastCheck = Date.now();
    try {
      const html = await (await fetch("./?check=" + Date.now(), { cache: "no-store" })).text();
      const m = /const APP_VERSION = "([^"]+)"/.exec(html);
      if (m && m[1] !== APP_VERSION) $("updateBar").hidden = false;
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
  $("updateBar").addEventListener("click", () => location.reload());
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data.weeks !== "object") throw new Error("bad file");
        if (!confirm(t("restoreConfirm"))) return;
        if (!Array.isArray(data.program)) data.program = starterProgram();
        data.onboarded = true; if (!data.name) data.name = state.name;
        state = data; editing.clear(); save(); render(); renderProfile(); toast(t("restored"));
      } catch (err) { alert(t("badBackup")); }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  applyStatic();
  render();
  protectStorage();
  if (!state.name || !state.onboarded) openWelcome("first");
})();
</script>
</body>

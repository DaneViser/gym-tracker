<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Phone-friendly weekly gym tracker. Build your own workouts, log sets, see your progress.">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- Styles: one file per area, loaded in this order (responsive.css must stay last). -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sheets.css">
<link rel="stylesheet" href="css/week.css">
<link rel="stylesheet" href="css/workouts.css">
<link rel="stylesheet" href="css/progress.css">
<link rel="stylesheet" href="css/clock.css">
<link rel="stylesheet" href="css/achievements.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/notices.css">
<link rel="stylesheet" href="css/timer.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/nutrition.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="hello" id="hello"></p>
      <h1>Gym <span>Tracker</span></h1>
    </div>
    <div class="hright">
      <div class="mclock" id="mclock" role="img">
        <span class="mt ghost" aria-hidden="true">88:88<span class="ms">:88</span></span>
        <span class="mt" aria-hidden="true"><span id="mHM">--:--</span><span class="ms" id="mS">:--</span></span>
      </div>
      <div class="btns">
        <button class="icon-btn" id="helpBtn" data-i18n-aria="howTo">?</button>
        <button class="icon-btn" id="progressBtn" data-i18n-aria="progress"><i data-icon="chart-line"></i></button>
        <button class="icon-btn" id="nutriBtn" data-i18n-aria="nutriTitle"><i data-icon="tools-kitchen-2"></i></button>
        <button class="icon-btn avatar-btn" id="profileBtn" data-i18n-aria="profile"><span id="avatarInitial"></span></button>
      </div>
    </div>
  </header>

  <section class="weekbar">
    <div class="weeknav">
      <button class="icon-btn" id="prevWk" data-i18n-aria="prevWeek"><i data-icon="chevron-left"></i></button>
      <div class="label"><b id="wkTitle"></b><small id="wkRange"></small></div>
      <button class="icon-btn" id="nextWk" data-i18n-aria="nextWeek"><i data-icon="chevron-right"></i></button>
    </div>
    <div class="progress">
      <div class="bar" id="bar"><i></i></div>
      <span class="count" id="count">0/0</span>
    </div>
    <div class="history" id="history"></div>
  </section>

  <div class="nag" id="nag" hidden>
    <span class="nag-ico" data-icon="device-floppy"></span>
    <div class="nt"><b data-i18n="nagTitle"></b><small id="nagText"></small></div>
    <div class="na"><button class="pill" id="nagLater" type="button" data-i18n="later"></button><button class="pill primary" id="nagBackup" type="button" data-i18n="backupNow"></button></div>
  </div>

  <main id="sessions"></main>
  <button class="add-workout" id="addWorkout" type="button" data-i18n="addWorkout"></button>

  <details class="info">
    <summary><span class="sum-t"><i data-icon="device-mobile"></i> <span data-i18n="installTitle"></span></span></summary>
    <p style="margin:0 0 8px" data-i18n="installLead"></p>
    <ul class="install-steps" data-i18n="installSteps"></ul>
  </details>
  <details class="info">
    <summary data-i18n="warmTitle"></summary>
    <ul data-i18n="warmList"></ul>
  </details>
  <details class="info">
    <summary data-i18n="rulesTitle"></summary>
    <ul data-i18n="rulesList"></ul>
  </details>

  <div class="tools">
    <button class="icon-btn" id="todayBtn" data-i18n="jumpWeek"></button>
  </div>
  <p class="note" data-i18n="footNote"></p>
</div>

<div class="toast" id="toast"></div>
<button class="update-bar" id="updateBar" type="button" hidden><i data-icon="sparkles"></i> <span data-i18n="updateReady"></span></button>

<div class="timer" id="timer">
  <div class="tbar" id="tbar"></div>
  <div class="timer-in">
    <div class="clock"><small id="tlabel"></small><span id="tclock" aria-live="polite">0:00</span></div>
    <div class="presets" id="presets">
      <button type="button" data-s="60">1:00</button>
      <button type="button" data-s="90">1:30</button>
      <button type="button" data-s="120">2:00</button>
      <button type="button" data-s="180">3:00</button>
    </div>
  </div>
</div>

<!-- Progress -->
<div class="modal" id="progress" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="sheet tall">
    <div class="p-top">
      <h2 id="pTitle"><i data-icon="chart-line"></i> <span data-i18n="progressTitle"></span></h2>
      <button class="p-close" id="pClose" type="button" data-i18n-aria="close"><i data-icon="x"></i></button>
    </div>
    <label class="field"><span data-i18n="exercise"></span><select class="sel" id="pSelect"></select></label>
    <div id="pBody"></div>
  </div>
</div>

<!-- Profile -->
<div class="modal" id="profile" role="dialog" aria-modal="true" aria-labelledby="prName">
  <div class="sheet tall">
    <div class="p-top">
      <div class="pr-id">
        <div class="avatar" id="prAvatar"></div>
        <div><h2 id="prName"></h2><small id="prSince"></small></div>
      </div>
      <button class="p-close" id="prClose" type="button" data-i18n-aria="close"><i data-icon="x"></i></button>
    </div>

    <div class="stats pr-stats" id="prStats"></div>
    <p class="pr-fun" id="prFun"></p>

    <button class="ach-entry" id="achOpen" type="button">
      <span class="ach-prev" id="achPrev"></span>
      <span class="ae-t"><b data-i18n="achTitle"></b><small id="achEntrySub"></small></span>
      <i class="chev-r" data-icon="chevron-right"></i>
    </button>

    <div class="cal" id="prCalendar"></div>

    <h3 class="pr-h" data-i18n="settings"></h3>
    <div class="pr-list">
      <label class="pr-row"><span data-i18n="nameField"></span>
        <span class="pr-inline"><input class="txt" id="prNameInput" type="text" maxlength="30" autocomplete="given-name"><button class="pill" id="prNameSave" type="button" data-i18n="save"></button></span>
      </label>
      <div class="pr-row"><span data-i18n="language"></span>
        <div class="seg" id="prLang"><button type="button" data-v="en">English</button><button type="button" data-v="sr">Srpski</button></div>
      </div>
      <div class="pr-row"><span data-i18n="themeLbl"></span>
        <div class="seg" id="prTheme"><button type="button" data-v="auto" data-i18n="themeAuto"></button><button type="button" data-v="light" data-i18n="themeLight"></button><button type="button" data-v="dark" data-i18n="themeDark"></button></div>
      </div>
      <div class="pr-row"><span><b data-i18n="soundLbl"></b><small data-i18n="soundHint"></small></span>
        <div class="seg" id="prSound"><button type="button" data-v="off" data-i18n="soundOff"></button><button type="button" data-v="timer" data-i18n="soundTimer"></button><button type="button" data-v="all" data-i18n="soundAll"></button></div>
      </div>
      <div class="pr-row"><span><b data-i18n="benchFor"></b><small data-i18n="benchForHint"></small></span>
        <div class="seg" id="prSex"><button type="button" data-v="m" data-i18n="sexM"></button><button type="button" data-v="f" data-i18n="sexF"></button><button type="button" data-v="x" data-i18n="sexX"></button></div>
      </div>
      <label class="pr-row"><span><b data-i18n="bwField"></b><small data-i18n="bwHint"></small></span>
        <span class="pr-inline bw"><input class="txt" id="prBw" type="text" inputmode="decimal" maxlength="6" placeholder="kg"><button class="pill" id="prBwSave" type="button" data-i18n="save"></button></span>
      </label>
      <button class="pr-row pr-btn" id="prGuide" type="button"><span data-i18n="howTo"></span><i class="chev-r" data-icon="chevron-right"></i></button>
    </div>

    <h3 class="pr-h" data-i18n="records"></h3>
    <div id="prRecords"></div>

    <h3 class="pr-h" data-i18n="dataTitle"></h3>
    <div class="pr-list">
      <button class="pr-row pr-btn" id="exportBtn" type="button"><span><b data-i18n="backup"></b><small data-i18n="backupD"></small></span><i class="chev-r" data-icon="chevron-right"></i></button>
      <button class="pr-row pr-btn" id="importBtn" type="button"><span><b data-i18n="restore"></b><small data-i18n="restoreD"></small></span><i class="chev-r" data-icon="chevron-right"></i></button>
      <button class="pr-row pr-btn" id="templateBtn" type="button"><span><b data-i18n="loadStarter"></b><small data-i18n="loadStarterD"></small></span><i class="chev-r" data-icon="chevron-right"></i></button>
      <button class="pr-row pr-btn danger" id="wipeBtn" type="button"><span><b data-i18n="wipe"></b><small data-i18n="wipeD"></small></span><i class="chev-r" data-icon="chevron-right"></i></button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="note" data-i18n="localNote"></p>
    <p class="note" id="prStorage"></p>
  </div>
</div>

<!-- Calorie calculator -->
<div class="modal" id="nutri" role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="sheet tall">
    <div class="p-top">
      <h2 id="nTitle"><i data-icon="tools-kitchen-2"></i> <span data-i18n="nutriTitle"></span></h2>
      <button class="p-close" id="nClose" type="button" data-i18n-aria="close"><i data-icon="x"></i></button>
    </div>
    <p class="lead" data-i18n="nutriLead"></p>
    <div class="n-form">
      <div class="row3">
        <label class="field"><span data-i18n="nWeight"></span><input class="txt" id="nKg" type="text" inputmode="decimal" maxlength="5" placeholder="kg"></label>
        <label class="field"><span data-i18n="nHeight"></span><input class="txt" id="nCm" type="text" inputmode="decimal" maxlength="5" placeholder="cm"></label>
        <label class="field"><span data-i18n="nAge"></span><input class="txt" id="nAge" type="text" inputmode="numeric" maxlength="3"></label>
      </div>
      <div class="field"><span data-i18n="nSex"></span>
        <div class="seg" id="nSex"><button type="button" data-v="m" data-i18n="sexM"></button><button type="button" data-v="f" data-i18n="sexF"></button><button type="button" data-v="x" data-i18n="sexX"></button></div>
      </div>
      <label class="field"><span data-i18n="nJobLbl"></span><select class="sel" id="nJob"></select></label>
      <div class="row2">
        <label class="field"><span data-i18n="nSessions"></span><select class="sel" id="nSessions"></select></label>
        <label class="field"><span data-i18n="nMinutes"></span><select class="sel" id="nMinutes"></select></label>
      </div>
      <label class="field"><span data-i18n="nGoalLbl"></span><select class="sel" id="nGoal"></select></label>
    </div>
    <div id="nOut" aria-live="polite"></div>
    <p class="note" data-i18n="nDisclaimer"></p>
  </div>
</div>

<!-- Achievements sheet -->
<div class="modal" id="achSheet" role="dialog" aria-modal="true" aria-labelledby="achSTitle">
  <div class="sheet tall">
    <div class="p-top">
      <h2 id="achSTitle"><span data-i18n="achTitle"></span> <span class="ach-count" id="achCount"></span></h2>
      <button class="p-close" id="achSClose" type="button" data-i18n-aria="close"><i data-icon="x"></i></button>
    </div>
    <div id="achGrid"></div>
    <p class="note" data-i18n="achFoot"></p>
  </div>
</div>

<!-- Achievement detail -->
<div class="modal" id="achModal" role="dialog" aria-modal="true" aria-labelledby="achMTitle">
  <div class="sheet">
    <div class="p-top"><span></span><button class="p-close" id="achClose" type="button" data-i18n-aria="close"><i data-icon="x"></i></button></div>
    <div class="ach-detail" id="achDetail"></div>
  </div>
</div>

<!-- Celebration card (new record / achievement unlocked) -->
<button class="celebrate" id="celebrate" type="button" hidden></button>

<!-- Welcome / guide -->
<div class="modal" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
  <div class="sheet">
    <div class="toprow">
      <div class="stepdots" id="stepdots"><i></i><i></i></div>
      <div class="seg" id="langSeg" role="group" aria-label="Language / Jezik">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="sr">SR</button>
      </div>
    </div>

    <div id="step1">
      <h2><span id="wTitle"></span> <i id="wWave" data-icon="hand-stop"></i></h2>
      <p class="lead" data-i18n="welcomeLead"></p>
      <label class="field"><span data-i18n="nameLabel"></span>
        <input class="txt" id="nameInput" type="text" maxlength="30" autocomplete="given-name" data-i18n-ph="namePh">
      </label>
      <div class="err" id="nameErr"></div>
      <div id="programChoice">
        <p style="margin:12px 0 4px;font-weight:700" data-i18n="howStart"></p>
        <div class="choice">
          <label><input type="radio" name="start" value="template" checked>
            <span><b data-i18n="starterT"></b><small data-i18n="starterD"></small></span></label>
          <label><input type="radio" name="start" value="empty">
            <span><b data-i18n="ownT"></b><small data-i18n="ownD"></small></span></label>
        </div>
      </div>
      <div class="actions"><button class="pill primary" id="next1" type="button"></button></div>
    </div>

    <div id="step2" hidden>
      <h2 data-i18n="howTitle"></h2>
      <p class="lead" id="guideLead"></p>
      <ul class="howto">
        <li><span class="ico" data-icon="calendar"></span><span data-i18n="how1"></span></li>
        <li><span class="ico" data-icon="circle-check"></span><span data-i18n="how2"></span></li>
        <li><span class="ico" data-icon="barbell"></span><span data-i18n="how3"></span></li>
        <li><span class="ico" data-icon="pencil"></span><span data-i18n="how4"></span></li>
        <li><span class="ico" data-icon="stopwatch"></span><span data-i18n="how5"></span></li>
        <li><span class="ico" data-icon="device-floppy"></span><span data-i18n="how6"></span></li>
      </ul>
      <div class="actions">
        <button class="pill" id="back2" type="button" data-i18n="back"></button>
        <button class="pill primary" id="finish" type="button"></button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts: ES modules. main.js imports everything else (see AGENTS.md). -->
<script type="module" src="js/main.js"></script>
</body>
</html>
